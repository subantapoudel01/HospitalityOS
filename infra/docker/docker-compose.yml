services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: hospitalityos
      POSTGRES_USER: hospitalityos
      POSTGRES_PASSWORD: devpassword
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hospitalityos -d hospitalityos"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ../../backend
    env_file: ../../.env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports: ["8000:8000"]
    volumes: ["../../backend:/app"]

  frontend:
    build: ../../frontend
    env_file: ../../.env
    depends_on: [backend]
    ports: ["3000:3000"]
    volumes:
      - ../../frontend:/app
      - /app/node_modules
      - /app/.next

volumes:
  pgdata:
